name: trading-lab

services:
  guard:
    image: python:3.12.10-slim
    volumes:
      - ./scripts:/scripts:ro
      - ./freqtrade/user_data:/user_data:ro
    command: python /scripts/check_configs.py /user_data

  postgres:
    image: postgres:16.10
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ft_sim
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ft_sim"]
      interval: 5s
      retries: 10

  freqtrade-sim:
    image: freqtradeorg/freqtrade:${FREQTRADE_VERSION}
    restart: unless-stopped
    depends_on:
      guard:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./freqtrade/user_data:/freqtrade/user_data
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FREQTRADE__DB_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ft_sim
      FREQTRADE__API_SERVER__USERNAME: ${FT_API_USERNAME}
      FREQTRADE__API_SERVER__PASSWORD: ${FT_API_PASSWORD}
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: ${FT_JWT_SECRET}
      FREQTRADE__API_SERVER__WS_TOKEN: ${FT_WS_TOKEN}
      FREQTRADE__TELEGRAM__ENABLED: ${TELEGRAM_ENABLED:-false}
      FREQTRADE__TELEGRAM__TOKEN: ${TELEGRAM_TOKEN:-}
      FREQTRADE__TELEGRAM__CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade-sim.log
      --config /freqtrade/user_data/config.base.json
      --config /freqtrade/user_data/config.sim.json
      --strategy BreakoutTrend

  # Herramienta para backtests y descargas: docker compose run --rm ft <comando>
  ft:
    image: freqtradeorg/freqtrade:${FREQTRADE_VERSION}
    profiles: ["tools"]
    volumes:
      - ./freqtrade/user_data:/freqtrade/user_data

volumes:
  pgdata:
